<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Clientes | BarberShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .tarjeta-login {
            background-color: var(--bg-secundario);
            border: 1px solid var(--borde);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }
        .alerta {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid transparent;
            text-align: center;
        }
        .error-alerta {
            background-color: #721c24;
            color: #f8d7da;
            border-color: #f5c6cb;
        }
        .exito-alerta {
            background-color: #155724;
            color: #d4edda;
            border-color: #c3e6cb;
        }
        .toggle-link {
            color: var(--color-oro);
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="tarjeta-login">
            <div class="logo" style="text-align: center; margin-bottom: 5px;">BarberShop</div>
            <p id="auth-subtitulo" style="text-align: center; color: var(--texto-mutado); margin-bottom: 25px; font-size: 0.9rem;">Ingresa a tu cuenta de cliente</p>
            
            <div id="mensaje-error" class="alerta error-alerta"></div>
            <div id="mensaje-exito" class="alerta exito-alerta"></div>

            <form id="formAuth">
                
                <div class="form-grupo" id="grupo-nombre" style="display: none; margin-bottom: 15px;">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Tu nombre y apellido">
                </div>

                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@barberia.com" required>
                </div>

                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-submit" class="btn" style="margin-top: 10px; width: 100%;">Ingresar al Panel</button>
            </form>
            
            <p style="text-align: center; margin-top: 25px; font-size: 0.9rem;">
                <span id="texto-cambio">¿No tienes cuenta?</span> 
                <a id="link-toggle" class="toggle-link" onclick="alternarModo()">Regístrate aquí</a>
            </p>
            
            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                <a href="index.html" style="color: var(--texto-mutado); text-decoration: none;">← Volver al inicio</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    
    <script>
        let esRegistro = false;

        function alternarModo() {
            esRegistro = !esRegistro;
            
            const grupoNombre = document.getElementById('grupo-nombre');
            const inputNombre = document.getElementById('nombre');
            const subtitulo = document.getElementById('auth-subtitulo');
            const btnSubmit = document.getElementById('btn-submit');
            const textoCambio = document.getElementById('texto-cambio');
            const linkToggle = document.getElementById('link-toggle');
            
            // Limpiar alertas al conmutar
            document.getElementById('mensaje-error').style.display = 'none';
            document.getElementById('mensaje-exito').style.display = 'none';

            if (esRegistro) {
                subtitulo.textContent = 'Crea una cuenta nueva en la barbería';
                grupoNombre.style.display = 'block';
                inputNombre.required = true;
                btnSubmit.textContent = 'Registrarme ahora';
                textoCambio.textContent = '¿Ya tienes una cuenta?';
                linkToggle.textContent = 'Inicia sesión';
            } else {
                subtitulo.textContent = 'Ingresa a tu cuenta de cliente';
                grupoNombre.style.display = 'none';
                inputNombre.required = false;
                btnSubmit.textContent = 'Ingresar al Panel';
                textoCambio.textContent = '¿No tienes cuenta?';
                linkToggle.textContent = 'Regístrate aquí';
            }
        }
    </script>
</body>
</html>
