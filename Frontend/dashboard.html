<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | BarberShop</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/auth.js"></script>
    <script>
        // Validación inmediata antes de renderizar la página
        verificarAutenticacion();
    </script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 73px);
        }
        .sidebar {
            background-color: var(--bg-secundario);
            border-right: 1px solid var(--borde);
            padding: 20px;
        }
        .sidebar-menu {
            list-style: none;
            margin-top: 30px;
        }
        .sidebar-menu li a {
            display: block;
            padding: 12px;
            color: var(--texto-blanco);
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .sidebar-menu li a.active, .sidebar-menu li a:hover {
            background-color: var(--bg-tarjeta);
            color: var(--color-oro);
        }
        .main-content {
            padding: 40px;
            background-color: var(--bg-principal);
        }
        /* Tabla Responsiva */
        .tabla-contenedor {
            overflow-x: auto;
            margin-top: 20px;
            background-color: var(--bg-secundario);
            border: 1px solid var(--borde);
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--borde);
        }
        th {
            background-color: var(--bg-tarjeta);
            color: var(--color-oro);
        }
        .btn-accion {
            padding: 6px 12px;
            background-color: #9c2424;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-accion:hover { background-color: #bf2c2c; }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .sidebar { display: none; } /* En móvil ocultamos el sidebar para simplificar */
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Panel Barbería</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span id="nombre-usuario" style="color: var(--texto-mutado);">Bienvenido...</span>
                <button onclick="cerrarSesion()" class="btn" style="padding: 8px 15px; font-size: 0.85rem; width: auto; background-color: transparent; border: 1px solid var(--borde); color: white;">Salir</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-grid">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active">📅 Ver Citas</a></li>
                <li><a href="#servicios">✂️ Mis Servicios</a></li>
                <li><a href="#config">⚙️ Configuración</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2 style="margin-bottom: 10px;">Gestión de Agenda</h2>
            <p style="color: var(--texto-mutado);">Lista de las próximas citas agendadas por los clientes.</p>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-citas">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--texto-mutado);">Cargando citas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const API_DASHBOARD = 'http://localhost:3000/api';

        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar nombre del usuario logueado
            const usuario = JSON.parse(localStorage.getItem('usuario'));
            if(usuario) {
                document.getElementById('nombre-usuario').textContent = `Hola, ${usuario.nombre}`;
            }

            cargarCitas();
        });

        async function cargarCitas() {
            const tabla = document.getElementById('tabla-citas');
            const token = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_DASHBOARD}/citas`, {
                    headers: {
                        'Authorization': `Bearer ${token}` // Adjuntamos el token JWT en las cabeceras
                    }
                });

                if(!response.ok) throw new Error('No se pudieron cargar las citas');
                
                const citas = await response.json();
                tabla.innerHTML = '';

                if(citas.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="5" style="text-align: center;">No hay citas agendadas para hoy.</td></tr>`;
                    return;
                }

                citas.forEach(cita => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>${cita.cliente}</strong></td>
                        <td>${cita.Servicio?.nombre || 'General'}</td>
                        <td>${cita.fecha}</td>
                        <td>${cita.hora}</td>
                        <td>
                            <button class="btn-accion" onclick="cancelarCita(${cita.id})">Cancelar</button>
                        </td>
                    `;
                    tabla.appendChild(fila);
                });

            } catch (error) {
                console.error(error);
                // Datos mock / Simulación para desarrollo visual inicial:
                tabla.innerHTML = `
                    <tr>
                        <td><strong>Mateo Restrepo</strong></td>
                        <td>Corte + Barba</td>
                        <td>2026-06-01</td>
                        <td>14:30</td>
                        <td><button class="btn-accion" onclick="alert('Cita cancelada mock')">Cancelar</button></td>
                    </tr>
                    <tr>
                        <td><strong>Andrés Alzate</strong></td>
                        <td>Perfilado de cejas</td>
                        <td>2026-06-01</td>
                        <td>15:15</td>
                        <td><button class="btn-accion" onclick="alert('Cita cancelada mock')">Cancelar</button></td>
                    </tr>
                `;
            }
        }
    </script>
</body>
</html>
